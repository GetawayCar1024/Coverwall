<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#101010" />

  <title>Coverwall</title>

  <meta
    name="description"
    content="Coverwall turns a Spotify playlist into an album cover wall: every cover once, sized by track count, in a classic, heart, circle, diamond or hexagon shape."
  />

  <link
    rel="icon"
    href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%231ed760'/%3E%3Crect x='6' y='6' width='12' height='12' fill='%23081b0e'/%3E%3Crect x='20' y='6' width='6' height='6' fill='%23081b0e'/%3E%3Crect x='20' y='14' width='6' height='12' fill='%23081b0e'/%3E%3Crect x='6' y='20' width='12' height='6' fill='%23081b0e'/%3E%3C/svg%3E"
  />
</head>

<body>
  <div class="app">

    <header class="topbar">
      <div class="brand">
        <div class="brand-mark">▦</div>
        <div>
          <b>Coverwall</b>
          <small data-i18n="tagline"></small>
        </div>
      </div>

      <div class="topbar-actions">
        <span id="spotifyStatus" class="status-pill" data-i18n="spotifyConnected" hidden></span>
        <button
          id="langBtn"
          class="button"
          type="button"
          data-i18n="switchLanguage"
          data-i18n-title="switchLanguageTitle"
        ></button>
      </div>
    </header>

    <!-- Import -->
    <section class="import-card">
      <div class="section-heading">
        <b data-i18n="importHeading"></b>
      </div>

      <div class="import-row">
        <input
          id="playlistUrl"
          type="url"
          data-i18n-placeholder="playlistPlaceholder"
          data-i18n-title="playlistPlaceholder"
        />
        <button id="importBtn" class="button primary" type="button" data-i18n="importButton"></button>
        <button id="demoBtn" class="button" type="button" data-i18n="sampleButton"></button>
      </div>

      <p class="fine-print">
        <span data-i18n="importNote"></span>
        <button id="clientIdBtn" class="link-button" type="button"></button>
        <button id="disconnectBtn" class="link-button" type="button" data-i18n="disconnect" hidden></button>
      </p>
    </section>

    <!-- Playlist summary -->
    <section class="playlist-head">
      <div>
        <small data-i18n="playlistLabel"></small>
        <h1 id="playlistName"></h1>
      </div>

      <div class="history">
        <button id="undoBtn" class="button" type="button" data-i18n="undo" disabled></button>
        <button id="redoBtn" class="button" type="button" data-i18n="redo" disabled></button>
      </div>
    </section>

    <section class="stats">
      <div><small data-i18n="tracks"></small><b id="trackCount">0</b></div>
      <div><small data-i18n="albums"></small><b id="albumCount">0</b></div>
      <div><small data-i18n="artists"></small><b id="artistCount">0</b></div>
    </section>

    <main class="workspace">

      <!-- Cover wall -->
      <section class="canvas-column">
        <div class="section-heading">
          <b data-i18n="wallHeading"></b>
          <span id="gridInfo"></span>
        </div>

        <div id="treemap" class="mosaic"></div>

        <div class="toolbar">
          <div id="shapePicker" class="segmented" role="radiogroup" data-i18n-title="shapeLabel"></div>
          <button id="shuffleBtn" class="button" type="button" data-i18n="shuffle"></button>
          <button id="mergeBtn" class="button" type="button" data-i18n="mergeSimilar"></button>
        </div>
      </section>

      <aside class="sidebar">

        <!-- Editor -->
        <section class="panel">
          <div class="section-heading">
            <b data-i18n="editHeading"></b>
          </div>

          <p id="emptyInspector" class="hint" data-i18n="editEmpty"></p>

          <div id="inspector" hidden>
            <div id="selectedArt" class="selected-art"></div>

            <h3 id="selectedTitle"></h3>
            <p id="selectedArtist" class="muted"></p>

            <div id="versionPicker" class="versions" hidden>
              <span class="field-label" data-i18n="coverVersion"></span>
              <div id="versionList" class="version-list"></div>
              <button id="splitBtn" class="link-button" type="button" data-i18n="splitVersions"></button>
            </div>

            <label for="weightRange" class="field-label">
              <span data-i18n="weight"></span>
              <input id="weightNumber" type="number" min="1" max="10000" value="1" data-i18n-title="weight" />
            </label>
            <input id="weightRange" type="range" min="1" max="100" value="1" />

            <p id="areaInfo" class="hint"></p>

            <div class="button-pair">
              <button id="resetWeightBtn" class="button" type="button" data-i18n="resetWeight"></button>
              <button id="hideBtn" class="button" type="button"></button>
            </div>
          </div>
        </section>

        <!-- Display -->
        <section class="panel settings">
          <div class="section-heading">
            <b data-i18n="settingsHeading"></b>
          </div>

          <label class="check">
            <input id="labelsCheck" type="checkbox" />
            <span data-i18n="showLabels"></span>
          </label>

          <button id="resetAllBtn" class="button full" type="button" data-i18n="resetAll"></button>
        </section>

        <!-- Export -->
        <section class="panel">
          <div class="section-heading">
            <b data-i18n="exportHeading"></b>
          </div>

          <button id="exportPngBtn" class="button primary full" type="button" data-i18n="exportPng"></button>
          <button id="saveLayoutBtn" class="button full" type="button" data-i18n="saveJson"></button>

          <label class="button full upload-label">
            <span data-i18n="loadJson"></span>
            <input id="loadLayoutInput" type="file" accept=".json,application/json" hidden />
          </label>
        </section>
      </aside>
    </main>

    <section class="panel album-panel">
      <div class="section-heading">
        <b data-i18n="albumListHeading"></b>
        <span id="shownCount"></span>
      </div>

      <div id="albumList" class="album-list"></div>
    </section>

    <footer>
      <span data-i18n="footer"></span>
      <a
        class="repo-link"
        href="https://github.com/GetawayCar1024/coverwall"
        target="_blank"
        rel="noopener"
      >
        <svg viewBox="0 0 16 16" width="14" height="14" aria-hidden="true">
          <path fill="currentColor" d="M8 0C3.58 0 0 3.58 0 8c0 3.54 2.29 6.53 5.47 7.59.4.07.55-.17.55-.38 0-.19-.01-.82-.01-1.49-2.01.37-2.53-.49-2.69-.94-.09-.23-.48-.94-.82-1.13-.28-.15-.68-.52-.01-.53.63-.01 1.08.58 1.23.82.72 1.21 1.87.87 2.33.66.07-.52.28-.87.51-1.07-1.78-.2-3.64-.89-3.64-3.95 0-.87.31-1.59.82-2.15-.08-.2-.36-1.02.08-2.12 0 0 .67-.21 2.2.82.64-.18 1.32-.27 2-.27.68 0 1.36.09 2 .27 1.53-1.04 2.2-.82 2.2-.82.44 1.1.16 1.92.08 2.12.51.56.82 1.27.82 2.15 0 3.07-1.87 3.75-3.65 3.95.29.25.54.73.54 1.48 0 1.07-.01 1.93-.01 2.2 0 .21.15.46.55.38A8.013 8.013 0 0016 8c0-4.42-3.58-8-8-8z"/>
        </svg>
        GitHub
      </a>
    </footer>

    <div id="toast" role="status" aria-live="polite" hidden></div>
  </div>

  <script type="module" src="/src/main.js"></script>
</body>
</html>
