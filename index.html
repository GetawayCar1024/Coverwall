<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#101010" />

  <title>Coverwall</title>

  <meta
    name="description"
    content="Coverwall turns a Spotify playlist into an album cover wall: every cover once, sized by track count, in a classic, heart, circle, diamond or hexagon shape."
  />

  <link rel="icon" type="image/svg+xml" href="/icon.svg" />
  <link rel="icon" type="image/png" sizes="192x192" href="/icon-192.png" />
  <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
  <link rel="manifest" href="/manifest.webmanifest" />
  <meta name="apple-mobile-web-app-title" content="Coverwall" />
</head>

<body>
  <div class="app">

    <header class="topbar">
      <div class="brand">
        <img class="brand-mark" src="/icon.svg" alt="" />
        <div>
          <b>Coverwall</b>
          <small data-i18n="tagline"></small>
        </div>
      </div>

      <div class="topbar-actions">
        <span id="spotifyStatus" class="status-pill" data-i18n="spotifyConnected" hidden></span>
        <button id="langBtn" class="button" type="button" data-i18n-title="switchLanguageTitle"><i data-icon="language"></i><span data-i18n="switchLanguage"></span></button>
      </div>
    </header>

    <!-- Import -->
    <section class="import-card">
      <div class="section-heading">
        <b data-i18n="importHeading"></b>
      </div>

      <div class="import-row">
        <input
          id="playlistUrl"
          type="url"
          data-i18n-placeholder="playlistPlaceholder"
          data-i18n-title="playlistPlaceholder"
        />
        <button id="importBtn" class="button primary" type="button"><i data-icon="import"></i><span data-i18n="importButton"></span></button>
        <button id="demoBtn" class="button" type="button"><i data-icon="sample"></i><span data-i18n="sampleButton"></span></button>
      </div>

      <p class="fine-print">
        <span data-i18n="importNote"></span>
        <button id="clientIdBtn" class="link-button" type="button"></button>
        <button id="disconnectBtn" class="link-button" type="button" data-i18n="disconnect" hidden></button>
      </p>
    </section>

    <!-- Playlist summary -->
    <section class="playlist-head">
      <div>
        <small data-i18n="playlistLabel"></small>
        <h1 id="playlistName"></h1>
      </div>

      <div class="history">
        <button id="undoBtn" class="button" type="button" disabled><i data-icon="undo"></i><span data-i18n="undo"></span></button>
        <button id="redoBtn" class="button" type="button" disabled><i data-icon="redo"></i><span data-i18n="redo"></span></button>
      </div>
    </section>

    <section class="stats">
      <div><small data-i18n="tracks"></small><b id="trackCount">0</b></div>
      <div><small data-i18n="albums"></small><b id="albumCount">0</b></div>
      <div><small data-i18n="artists"></small><b id="artistCount">0</b></div>
    </section>

    <main class="workspace">

      <!-- Cover wall -->
      <section class="canvas-column">
        <div class="section-heading">
          <b data-i18n="wallHeading"></b>
          <span id="gridInfo"></span>
        </div>

        <div id="treemap" class="mosaic"></div>

        <div class="toolbar">
          <div id="shapePicker" class="segmented" role="radiogroup" data-i18n-title="shapeLabel"></div>
          <button id="shuffleBtn" class="button" type="button"><i data-icon="shuffle"></i><span data-i18n="shuffle"></span></button>
          <button id="mergeBtn" class="button" type="button"><i data-icon="merge"></i><span data-i18n="mergeSimilar"></span></button>
        </div>
      </section>

      <aside class="sidebar">

        <!-- Editor -->
        <section class="panel">
          <div class="section-heading">
            <b data-i18n="editHeading"></b>
          </div>

          <p id="emptyInspector" class="hint" data-i18n="editEmpty"></p>

          <div id="inspector" hidden>
            <div id="selectedArt" class="selected-art"></div>

            <h3 id="selectedTitle"></h3>
            <p id="selectedArtist" class="muted"></p>

            <div id="versionPicker" class="versions" hidden>
              <span class="field-label" data-i18n="coverVersion"></span>
              <div id="versionList" class="version-list"></div>
              <button id="splitBtn" class="link-button" type="button"><i data-icon="split"></i><span data-i18n="splitVersions"></span></button>
            </div>

            <label for="weightRange" class="field-label">
              <span data-i18n="weight"></span>
              <input id="weightNumber" type="number" min="1" max="10000" value="1" data-i18n-title="weight" />
            </label>
            <input id="weightRange" type="range" min="1" max="100" value="1" />

            <p id="areaInfo" class="hint"></p>

            <div class="button-pair">
              <button id="resetWeightBtn" class="button" type="button"><i data-icon="reset"></i><span data-i18n="resetWeight"></span></button>
              <button id="hideBtn" class="button" type="button"><i id="hideIcon" data-icon="hide"></i><span id="hideLabel"></span></button>
            </div>
          </div>
        </section>

        <!-- Display -->
        <section class="panel settings">
          <div class="section-heading">
            <b data-i18n="settingsHeading"></b>
          </div>

          <label class="check">
            <input id="labelsCheck" type="checkbox" />
            <span data-i18n="showLabels"></span>
          </label>

          <button id="resetAllBtn" class="button full" type="button"><i data-icon="reset"></i><span data-i18n="resetAll"></span></button>
        </section>

        <!-- Export -->
        <section class="panel">
          <div class="section-heading">
            <b data-i18n="exportHeading"></b>
          </div>

          <button id="exportPngBtn" class="button primary full" type="button"><i data-icon="download"></i><span data-i18n="exportPng"></span></button>
          <button id="saveLayoutBtn" class="button full" type="button"><i data-icon="fileDown"></i><span data-i18n="saveJson"></span></button>

          <label class="button full upload-label">
            <i data-icon="fileUp"></i><span data-i18n="loadJson"></span>
            <input id="loadLayoutInput" type="file" accept=".json,application/json" hidden />
          </label>
        </section>
      </aside>
    </main>

    <section class="panel album-panel">
      <div class="section-heading">
        <b data-i18n="albumListHeading"></b>
        <span id="shownCount"></span>
      </div>

      <div id="albumList" class="album-list"></div>
    </section>

    <footer>
      <span data-i18n="footer"></span>
      <a
        class="repo-link"
        href="https://github.com/GetawayCar1024/Coverwall"
        target="_blank"
        rel="noopener"
      >
        <i data-icon="github"></i>
        GitHub
      </a>
    </footer>

    <div id="toast" role="status" aria-live="polite" hidden></div>
  </div>

  <script type="module" src="/src/main.js"></script>
</body>
</html>
